services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////data/sentinelai.db
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SENTINELAI_API_TOKEN: ${SENTINELAI_API_TOKEN:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - sentinelai-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  sentinelai-data:
